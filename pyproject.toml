[project]
name = "rank-homes"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "pillow==13.0.0",
    "rfdetr[train]==1.12.1",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
rank-homes = "rank_homes.cli:main"

[dependency-groups]
dev = ["setuptools==81.0.0", "pyright==1.1.414"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/rank_homes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
