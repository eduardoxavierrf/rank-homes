[project]
name = "rank-homes"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "pillow==13.0.0",
    "rfdetr[train]==1.12.1",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
